<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Animation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f2f2f2;
}


.track{
    width:300px;
    height:300px;
    border:5px solid black;
    position:relative;
}


.car{
    position:absolute;
    animation:moveCar 6s linear infinite;
}

.car img{
    width:90px;
    height:40px;
}

@keyframes moveCar{

   
    0%{
        left:0;
        top:0;
        transform:rotate(0deg);
    }

    25%{
        left:210px;
        top:0;
        transform:rotate(0deg);
    }

    
    26%{
        transform:rotate(90deg);
    }

    50%{
        left:210px;
        top:260px;
        transform:rotate(90deg);
    }

    
    51%{
        transform:rotate(180deg);
    }

    75%{
        left:0;
        top:260px;
        transform:rotate(180deg);
    }

    
    76%{
        transform:rotate(270deg);
    }

    100%{
        left:0;
        top:0;
        transform:rotate(270deg);
    }
}
</style>

</head>
<body>

<div class="track">

    <div class="car">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_c2JnYOWjsle98JLdP6cPiqs9UfANd-LKlkuZ1FjZEg&s=10" alt="Car">
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .sub {
            background-color: red;
            color: white;
            border: none;
            height: 36px;
            width: 105px;
            border-radius: 2px;
            cursor: pointer;
            transition: opacity 1s;
        }

        .sub:hover {
            opacity: 0.7;

        }

        .sub:active {
            opacity: 0.2;
        }

        #butt {
            background-color: white;
            color: rgb(38, 70, 225);
            border-color: rgb(38, 70, 225);
            border-style: solid;
            border-width: 1px;
            height: 36px;
            width: 62px;
            border-radius: 2px;
            cursor: pointer;
            margin-left: 10px;

        }

        .tweet {
            background-color: blue;
            color: white;
            border: none;
            height: 36px;
            width: 100px;
            margin-left: 10px;
            border-radius: 18px;
            cursor: pointer;

        }

        .tweet:hover {
            box-shadow: 10px 10px 10px black;


        }
    </style>
</head>

<body>
    <button class="sub">subscribe

    </button>
    <button id="butt">join</button>
    <button class="tweet"> TWEET </button>

</body>

</html>

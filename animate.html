<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animate</title>
    <style>
        div {
            border: 2px solid;
            height: 100px;
            width: 100px;
            background-color: brown;
            position: absolute;

            animation-name: let;
            animation-duration: 3s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;

        }

        @keyframes let {
            0% {
                background-color: brown;
                left: 0;
                top: 0;
            }
            25%{
                background-color: blue;
                left: 200px;
                top: 0;
            }
            50%{
                background-color: chocolate;
                left:200px;
                top: 200px;
            }
            75%{
                background-color: aqua;
                left: 0;
                top: 200px;
            }
            100%{
                background-color: brown;
                left: 0;
                top: 0;
            }



        }
    </style>
</head>

<body>
    <div></div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        section {
            border: 1px solid black;
            display: grid;
            grid-template-columns: 100px 100px 100px 100px 100px 100px;
            grid-template-rows: 100px 100px 100px 100px 100px 100px;
        }
        .box1 {
            background-color: green;
            grid-area: 1/1/7/1;
        }

        .box2 {
            background-color: green;
            grid-area: 1/2/1/6;
        }
        .box3{
            background-color: red;
            grid-area: 1/6/1/6
        }
        .box4{
            background-color: greenyellow;
            grid-area: 2/6/7/6;
        }
        .box5{
            background-color: yellow;
            grid-area: 2/2/4/3;
        }

    </style>
</head>

<body>
    <section>
        <div class="box1">box1</div>
        <div class="box2">box2</div>
        <div class="box3">box3</div>
        <div class="box4">box4</div>
        <div class="box5">box5</div>
        <div class="box6">box6</div>
        <div class="box7">box1</div>
        <div class="box8">box1</div>
        <div class="box9">box1</div>
        <div class="box10">box1</div>
        <div class="box11">box1</div>
        <div class="box12">box1</div>
        <div class="box13">box1</div>
        <div class="box14">box1</div>
        <div class="box15">box1</div>
        <div class="box16">box1</div>



    </section>

</body>

</html>

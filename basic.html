<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .uber{
            background-color: black;
            color: white;
            height: 40px;
            width: 105px;
            border: solid;
            margin-bottom: 50px;

        }

        .amazon{
            background-color: rgb(255,216,20);
            color: black;
            border: none;
            height: 36px;
            width: 150px;
            border-radius: 18px;
            cursor: pointer;
            margin-right: 20px;
            margin-bottom: 20px;


        }
        .bootstrap{
            background-color: rgb(121,82,179);
            color: white;
            border: none;
            height: 36px;
            width: 100px;
            border-radius: 5px;
            margin-right: 10px;

        }
        .download{
            background-color: white;
            color: rgb(108,117,125);
            height: 36px;
            width: 100px;
            border-radius: 5px;
            margin-bottom: 50px;

        }
        .p{
            color: rgb(0,118,0);
            
            font-weight: bold;
            font-size: 20px;
        }
        .pp{
            font-size: large;

        }
        .atc{
            background-color: rgb(255,216,20);
            color: black;
            border: none;
            height: 36px;
            width: 120px;
            border-radius: 18px;
            margin-right: 20px;
        }
        .bn{
            background-color: rgb(255,164,28);
            color: black;
            height: 36px;
            width: 100px;
            border-radius: 18px;

        }


       

    </style>
</head>
<body>
    <div>    <button class="uber">request now</button>
</div>
<div>    <button class="amazon">Add to Cart</button>
</div>
<div >
    <button class="bootstrap"> get started</button>
    <button class="download"> Download</button>
</div>
<section>
    <div>
    <a href="https://www.amazon.in" target="_blank"> Go back to Amazon</a>
</div>
<div> <h1> Nike Black Running Shoes</h1></div>
<div>
    <p class="p"> $39-in stock</p>
</div>
<div>
    <p class="pp">Free delivery tomorrow.</p>
</div>
<div>
    <button class="atc"> Add to Cart </button>
    <button class="bn"> Buy Now</button>
</div>
    </section>

    
    
</body>
</html>

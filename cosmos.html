<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Navbar with Hover Dropdown</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

/* ================= NAVBAR ================= */

nav{
    height:70px;
    border:2px solid black;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 40px;
    position:relative;
}

.logo img{
    height:50px;
    width:auto;
}

.menu{
    display:flex;
    list-style:none;
    gap:35px;
}

.menu li{
    cursor:pointer;
    font-size:18px;
    font-weight:500;
}

.menu li:hover{
    color:blue;
}

/* Hamburger Icon */

.icon{
    display:none;
    font-size:30px;
    cursor:pointer;
}

/* ================= GRID ================= */

.grid-cont{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    padding:20px;
}

.box{
    height:200px;
    border:2px solid black;
    background:#e6e6e6;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    font-weight:bold;
}

/* ================= TABLET ================= */

@media screen and (max-width:630px){

    .icon{
        display:block;
    }

    .menu{
        display:none;
        flex-direction:column;
        position:absolute;
        top:70px;
        right:10px;
        width:220px;
        background:white;
        border:1px solid gray;
        box-shadow:0px 5px 10px rgba(0,0,0,0.3);
        gap:0;
    }

    .menu li{
        padding:15px;
        border-bottom:1px solid #ddd;
        text-align:center;
    }

    /* Show menu when hovering over the hamburger */
    .icon:hover + .menu,
    .menu:hover{
        display:flex;
    }

    .grid-cont{
        grid-template-columns:repeat(2,1fr);
    }
}

/* ================= MOBILE ================= */

@media screen and (max-width:400px){

    .grid-cont{
        grid-template-columns:1fr;
    }

    .logo img{
        height:40px;
    }

    nav{
        padding:0 20px;
    }

}

</style>

</head>
<body>

<nav>

    <div class="logo">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTZVYr3O5uqklPZBo4SqO8hPkAFZ8_3dSuzTLOZjP7XNQ&s=10" alt="Logo">
    </div>

    <div class="icon">
        <i class="fa-solid fa-bars"></i>
    </div>

    <ul class="menu">
        <li>Home</li>
        <li>About Us</li>
        <li>Services</li>
        <li>Contact</li>
        <li>More Info</li>
    </ul>

</nav>

<div class="grid-cont">

    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
    <div class="box">7</div>
    <div class="box">8</div>
    <div class="box">9</div>

</div>

</body>
</html>
